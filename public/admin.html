<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gestión de Prestaciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde: #50CB93;
      --verde-dark: #3aab76;
      --gris: #f4f5f6;
      --text: #2b2d33;
      --border: #e0e2e6;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--gris);
      padding: 2rem;
    }

    header {
      background: white;
      padding: 2rem;
      border-radius: 15px;
      margin-bottom: 2rem;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--text);
      margin-bottom: .5rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .form-card {
      background: white;
      padding: 2rem;
      border-radius: 15px;
      margin-bottom: 2rem;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .form-card h2 {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: .85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: .4rem;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: .8rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: .9rem;
      outline: none;
      transition: border .2s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--verde);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      padding: .9rem 2rem;
      background: var(--verde);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }

    .btn:hover {
      background: var(--verde-dark);
    }

    .btn-danger {
      background: #ef4444;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-secondary {
      background: #6b7280;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    table {
      width: 100%;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    thead {
      background: var(--verde);
      color: white;
    }

    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-weight: 600;
      font-size: .85rem;
    }

    td {
      font-size: .9rem;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    .actions {
      display: flex;
      gap: .5rem;
    }

    .actions button {
      padding: .5rem 1rem;
      font-size: .8rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🔧 Panel de Administración</h1>
    <p>Gestión de Prestaciones Médicas Fonasa</p>
  </header>

  <div class="form-card">
    <h2 id="formTitle">➕ Agregar Nueva Prestación</h2>
    <form id="prestacionForm">
      <input type="hidden" id="prestacionId">
      <div class="form-grid">
        <div class="form-group">
          <label>Nombre *</label>
          <input type="text" id="nombre" required>
        </div>
        <div class="form-group">
          <label>Código Fonasa</label>
          <input type="text" id="codigo_fonasa">
        </div>
        <div class="form-group">
          <label>Precio ($) *</label>
          <input type="number" id="precio" required>
        </div>
        <div class="form-group">
          <label>Copago (%) *</label>
          <input type="number" id="copago" min="0" max="100" required>
        </div>
        <div class="form-group">
          <label>Categoría</label>
          <select id="categoria">
            <option value="Consultas">Consultas</option>
            <option value="Laboratorio">Laboratorio</option>
            <option value="Imagenología">Imagenología</option>
            <option value="Procedimientos">Procedimientos</option>
            <option value="Cirugía">Cirugía</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
      </div>
      <div class="form-group" style="margin-bottom: 1rem;">
        <label>Descripción</label>
        <textarea id="descripcion"></textarea>
      </div>
      <div style="display: flex; gap: .5rem;">
        <button type="submit" class="btn" id="submitBtn">Guardar</button>
        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">Cancelar</button>
      </div>
    </form>
  </div>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Código</th>
        <th>Precio</th>
        <th>Copago</th>
        <th>Categoría</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="prestacionesTable">
      <tr><td colspan="6" style="text-align: center;">Cargando...</td></tr>
    </tbody>
  </table>
</div>

<script>
  let editandoId = null;

  async function cargarPrestaciones() {
    try {
      const response = await fetch('/api/prestaciones');
      const prestaciones = await response.json();
      
      const tbody = document.getElementById('prestacionesTable');
      if (prestaciones.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No hay prestaciones registradas</td></tr>';
        return;
      }

      tbody.innerHTML = prestaciones.map(p => `
        <tr>
          <td>${p.nombre}</td>
          <td>${p.codigo_fonasa || '-'}</td>
          <td>$${Number(p.precio).toLocaleString('es-CL')}</td>
          <td>${p.copago}%</td>
          <td>${p.categoria || '-'}</td>
          <td class="actions">
            <button class="btn" onclick="editarPrestacion(${p.id})">Editar</button>
            <button class="btn btn-danger" onclick="eliminarPrestacion(${p.id})">Eliminar</button>
          </td>
        </tr>
      `).join('');
    } catch (error) {
      console.error('Error cargando prestaciones:', error);
    }
  }

  async function editarPrestacion(id) {
    try {
      const response = await fetch('/api/prestaciones');
      const prestaciones = await response.json();
      const prestacion = prestaciones.find(p => p.id === id);
      
      if (!prestacion) return;

      document.getElementById('formTitle').textContent = '✏️ Editar Prestación';
      document.getElementById('prestacionId').value = prestacion.id;
      document.getElementById('nombre').value = prestacion.nombre;
      document.getElementById('codigo_fonasa').value = prestacion.codigo_fonasa || '';
      document.getElementById('precio').value = prestacion.precio;
      document.getElementById('copago').value = prestacion.copago;
      document.getElementById('categoria').value = prestacion.categoria || '';
      document.getElementById('descripcion').value = prestacion.descripcion || '';
      document.getElementById('submitBtn').textContent = 'Actualizar';
      document.getElementById('cancelBtn').style.display = 'block';
      
      editandoId = id;
    } catch (error) {
      console.error('Error:', error);
    }
  }

  async function eliminarPrestacion(id) {
    if (!confirm('¿Estás seguro de eliminar esta prestación?')) return;
    
    try {
      await fetch(`/api/prestaciones/${id}`, { method: 'DELETE' });
      cargarPrestaciones();
      alert('Prestación eliminada correctamente');
    } catch (error) {
      console.error('Error eliminando:', error);
      alert('Error al eliminar la prestación');
    }
  }

  document.getElementById('prestacionForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const data = {
      nombre: document.getElementById('nombre').value,
      codigo_fonasa: document.getElementById('codigo_fonasa').value,
      precio: parseFloat(document.getElementById('precio').value),
      copago: parseFloat(document.getElementById('copago').value),
      categoria: document.getElementById('categoria').value,
      descripcion: document.getElementById('descripcion').value
    };

    try {
      if (editandoId) {
        await fetch(`/api/prestaciones/${editandoId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        alert('Prestación actualizada correctamente');
      } else {
        await fetch('/api/prestaciones', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        alert('Prestación agregada correctamente');
      }
      
      resetForm();
      cargarPrestaciones();
    } catch (error) {
      console.error('Error:', error);
      alert('Error al guardar la prestación');
    }
  });

  document.getElementById('cancelBtn').addEventListener('click', resetForm);

  function resetForm() {
    document.getElementById('prestacionForm').reset();
    document.getElementById('prestacionId').value = '';
    document.getElementById('formTitle').textContent = '➕ Agregar Nueva Prestación';
    document.getElementById('submitBtn').textContent = 'Guardar';
    document.getElementById('cancelBtn').style.display = 'none';
    editandoId = null;
  }

  cargarPrestaciones();
</script>

</body>
</html>
